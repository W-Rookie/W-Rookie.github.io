name: Update security news

on:
  push:
    branches: [main]
    paths:
      - scripts/update_security_news.py
      - .github/workflows/security-news.yml
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect RSS headlines
        run: python scripts/update_security_news.py
      - name: Publish changed feed
        run: |
          if git diff --quiet -- assets/news-feed.json; then
            echo "News feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news-feed.json
          git commit -m "Refresh security news headlines"
          git push
