<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>W-Rookie — 메인 비주얼 후보</title>
  <style>
    :root{color-scheme:dark;--red:#ff2638;--ink:#090a0d;--panel:#111319;--line:#2a2d34;--text:#f7f7f8;--muted:#999da7}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 85% 0,rgba(255,38,56,.14),transparent 28%),var(--ink);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",sans-serif}
    main{width:min(1180px,calc(100% - 32px));margin:auto;padding:64px 0 80px}
    header{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}
    .eyebrow{margin:0 0 8px;color:var(--red);font:700 12px/1.2 ui-monospace,monospace;letter-spacing:.18em}
    h1{margin:0;font-size:clamp(28px,5vw,52px);letter-spacing:-.04em}
    header p:last-child{margin:0;color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
    figure{position:relative;margin:0;background:var(--panel);border:1px solid var(--line);overflow:hidden}
    figure:last-child{grid-column:1/-1;width:calc(50% - 11px);justify-self:center}
    img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;transition:transform .35s ease}
    figure:hover img{transform:scale(1.018)}
    figcaption{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;color:var(--muted);font:600 12px/1.2 ui-monospace,monospace;letter-spacing:.08em}
    b{display:grid;place-items:center;width:42px;height:42px;position:absolute;top:14px;left:14px;background:var(--red);color:#fff;font:800 20px/1 ui-monospace,monospace;box-shadow:0 8px 24px rgba(255,38,56,.35)}
    a{color:#fff;text-decoration:none}
    @media(max-width:720px){main{padding-top:34px}.grid{grid-template-columns:1fr}figure:last-child{grid-column:auto;width:100%}header{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">W-ROOKIE / HERO SELECT</p><h1>메인 비주얼 후보 5개</h1></div>
      <p>마음에 드는 이미지 번호를 알려주세요.</p>
    </header>
    <section class="grid" aria-label="모의해킹 메인 이미지 후보">
      <figure><b>1</b><a href="01.webp"><img src="01.webp" alt="모니터 앞에서 웹 취약점을 분석하는 모의해킹 전문가"></a><figcaption><span>WEB ASSESSMENT</span><span>ANALYST VIEW</span></figcaption></figure>
      <figure><b>2</b><a href="02.webp"><img src="02.webp" alt="노트북으로 취약점 진단을 수행하는 작업 장면"></a><figcaption><span>PENETRATION TEST</span><span>HANDS-ON</span></figcaption></figure>
      <figure><b>3</b><a href="03.webp"><img src="03.webp" alt="듀얼 모니터가 배치된 모의해킹 실습실"></a><figcaption><span>LIVE LAB</span><span>WORKSTATION</span></figcaption></figure>
      <figure><b>4</b><a href="04.webp"><img src="04.webp" alt="공격 경로를 분석하는 보안 전문가의 옆모습"></a><figcaption><span>RED TEAM</span><span>OPERATOR</span></figcaption></figure>
      <figure><b>5</b><a href="05.webp"><img src="05.webp" alt="공격 표면과 네트워크 흐름을 표시한 보안 실습 환경"></a><figcaption><span>ATTACK SURFACE</span><span>INFRASTRUCTURE</span></figcaption></figure>
    </section>
  </main>
</body>
</html>
